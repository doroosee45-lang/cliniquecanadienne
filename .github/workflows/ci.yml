name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    # T9.6 — conteneur MongoDB éphémère, isolé du cluster Atlas de dev
    # partagé (décision explicite : réutiliser Atlas depuis la CI aurait
    # réintroduit exactement le bruit de test que le ticket 0009 a fallu
    # nettoyer, mais à chaque push au lieu de juste pendant les sessions de
    # travail manuelles). Base entièrement fraîche à chaque run, aucune
    # donnée de référence pré-seedée requise par la suite.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/medisync_ci
      JWT_SECRET: ci-only-dummy-secret-never-used-outside-this-workflow
      JWT_EXPIRE: 1d
      JWT_COOKIE_EXPIRE: 1
      CLIENT_URL: http://localhost:5173
      GOOGLE_CLIENT_ID: ci-dummy-client-id
      # SMTP volontairement absent : la suite tolère déjà l'échec d'envoi
      # (voir noPlaintextPassword.test.js et consorts, écrits pour vérifier
      # justement le comportement quand l'email échoue) — pas besoin de
      # vraies identifiants SMTP pour que les tests passent en CI.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # T9.7 — seuil "critical" seulement : une faille haute (nodemailer,
      # non exploitable via l'usage de ce code, voir docs/tickets/0011) est
      # actée et documentée, pas corrigible sans saut majeur. "high" ferait
      # échouer la CI sur un risque déjà accepté à chaque run. Dependabot
      # reste le radar continu pour tout le reste (voir dependabot.yml).
      - run: npm audit --audit-level=critical

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # T9.7 — même logique que le job backend : xlsx (haute, sans correctif
      # disponible) et react-router-dom (modérées, saut majeur différé) sont
      # des risques déjà actés, voir docs/tickets/0011.
      - run: npm audit --audit-level=critical
